<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #17365d;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #17365d;
            color: white;
        }

        button {
            padding: 8px 15px;
            background-color: #17365d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Book Catalogue</h2>

<table>

    <tr>
        <th>Book</th>
        <th>Author</th>
        <th>Publisher</th>
        <th>Price</th>
        <th>Action</th>
    </tr>

    <tr>
        <td>Data Structures</td>
        <td>Seymour Lipschutz</td>
        <td>McGraw Hill</td>
        <td>₹450</td>
        <td>
            <button>Add to Cart</button>
        </td>
    </tr>

    <tr>
        <td>Operating System</td>
        <td>Galvin</td>
        <td>Wiley</td>
        <td>₹550</td>
        <td>
            <button>Add to Cart</button>
        </td>
    </tr>

    <tr>
        <td>Computer Networks</td>
        <td>Andrew Tanenbaum</td>
        <td>Pearson</td>
        <td>₹600</td>
        <td>
            <button>Add to Cart</button>
        </td>
    </tr>

</table>

</body>
</html>
