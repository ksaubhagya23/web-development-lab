<!DOCTYPE html>
<html>

<head>

    <title>Book Catalogue</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #777;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #17365d;
            color: white;
        }

        img {
            width: 80px;
            height: 100px;
            object-fit: cover;
        }

        button {
            padding: 8px 15px;
            background-color: #17365d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0d2440;
        }

    </style>

</head>

<body>

<h1>Book Catalogue</h1>

<table>

    <tr>

        <th>Cover</th>
        <th>Book Name</th>
        <th>Author</th>
        <th>Publisher</th>
        <th>Price</th>
        <th>Action</th>

    </tr>

    <tr>

        <td>
            <img src="https://via.placeholder.com/80x100"
                 alt="Book Cover">
        </td>

        <td>Data Structures</td>

        <td>Seymour Lipschutz</td>

        <td>McGraw Hill</td>

        <td>₹450</td>

        <td>
            <button>Add to Cart</button>
        </td>

    </tr>

    <tr>

        <td>
            <img src="https://via.placeholder.com/80x100"
                 alt="Book Cover">
        </td>

        <td>Operating System</td>

        <td>Galvin</td>

        <td>Wiley</td>

        <td>₹550</td>

        <td>
            <button>Add to Cart</button>
        </td>

    </tr>

    <tr>

        <td>
            <img src="https://via.placeholder.com/80x100"
                 alt="Book Cover">
        </td>

        <td>Computer Networks</td>

        <td>Andrew Tanenbaum</td>

        <td>Pearson</td>

        <td>₹600</td>

        <td>
            <button>Add to Cart</button>
        </td>

    </tr>

</table>

</body>

</html>
