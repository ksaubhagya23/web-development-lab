<!DOCTYPE html>
<html>

<head>

    <title>Shopping Cart</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #888;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #17365d;
            color: white;
        }

        button {
            padding: 6px 12px;
            border: none;
            background-color: #17365d;
            color: white;
            cursor: pointer;
        }

        .total {
            width: 80%;
            margin: auto;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h1>Shopping Cart</h1>

<table>

    <tr>
        <th>Book Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Action</th>
    </tr>

    <tr>

        <td>Data Structures</td>

        <td>₹450</td>

        <td>
            <input type="number"
                   value="1"
                   min="1">
        </td>

        <td>₹450</td>

        <td>
            <button>Remove</button>
        </td>

    </tr>

    <tr>

        <td>Operating System</td>

        <td>₹550</td>

        <td>
            <input type="number"
                   value="1"
                   min="1">
        </td>

        <td>₹550</td>

        <td>
            <button>Remove</button>
        </td>

    </tr>

</table>

<div class="total">

    Grand Total: ₹1000

    <br><br>

    <button>Proceed to Checkout</button>

</div>

</body>

</html>
