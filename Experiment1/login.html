<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            text-align: center;
        }

        form {
            background: white;
            width: 350px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background-color: #17365d;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Online Bookstore Login</h2>

<form>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button type="submit">Login</button>

</form>

</body>
</html>
